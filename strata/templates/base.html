<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{% block title %}Strata{% endblock %}</title>
<style>
  body { font: 15px/1.5 -apple-system, system-ui, sans-serif; margin: 0;
         color: #1a1a1a; background: #f6f6f4; }
  header { background: #22303f; color: #fff; padding: 12px 24px; }
  header a { color: #cfe3f5; margin-right: 18px; text-decoration: none; }
  header a.on { color: #fff; font-weight: 600; text-decoration: underline; }
  main { max-width: 1000px; margin: 0 auto; padding: 24px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  h2 { font-size: 15px; margin: 0; font-family: ui-monospace, monospace; }
  .sub { color: #666; font-size: 13px; margin-bottom: 20px; }
  .change { background: #fff; border: 1px solid #dcdcd6; border-radius: 6px;
            padding: 16px; margin-bottom: 18px; }
  .meta { color: #666; font-size: 12px; font-family: ui-monospace, monospace; }
  .claim { border-top: 1px solid #eee; padding-top: 12px; margin-top: 12px; }
  blockquote { margin: 8px 0; padding: 8px 12px; border-left: 3px solid #c9c9c2;
               background: #fafaf8; font-size: 14px; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 10px;
           font-size: 11px; font-weight: 600; text-transform: uppercase; }
  .verified { background: #d9efd9; color: #1c6b2a; }
  .near     { background: #fdf0cf; color: #7a5800; }
  .rejected { background: #fadbd8; color: #96271a; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #eee;
           vertical-align: top; }
  th { color: #666; font-weight: 600; font-size: 12px; }
  .path { font-family: ui-monospace, monospace; font-size: 12px; color: #444; }
  form.inline { display: inline; }
  button { font: inherit; font-size: 13px; padding: 3px 10px; cursor: pointer;
           border: 1px solid #b8b8b0; background: #fff; border-radius: 4px; }
  button.primary { background: #22303f; color: #fff; border-color: #22303f; }
  input, select, textarea { font: inherit; font-size: 13px; padding: 3px 6px;
           border: 1px solid #b8b8b0; border-radius: 4px; }
  .done { opacity: 0.5; }
  .note { background: #fdf0cf; border: 1px solid #e8d18a; padding: 8px 12px;
          border-radius: 4px; margin-bottom: 16px; font-size: 13px; }
</style>
</head>
<body>
<header>
  <a href="/projects/{{ project_id }}/review" class="{{ 'on' if page == 'review' }}">Review center</a>
  <a href="/projects/{{ project_id }}/queue" class="{{ 'on' if page == 'queue' }}">Expert queue</a>
  <a href="/projects/{{ project_id }}/audit" class="{{ 'on' if page == 'audit' }}">Audit</a>
</header>
<main>{% block body %}{% endblock %}</main>
</body>
</html>
